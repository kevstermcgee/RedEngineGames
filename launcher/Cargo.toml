[workspace]
resolver = "2"
members = ["core", "app"]
# `core` builds and tests anywhere; `app` (the Tauri window) is built on Windows by .github/workflows/launcher.yml.
default-members = ["core"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kevstermcgee/RedEngineGames"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
