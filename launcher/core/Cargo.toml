[package]
name = "redengine-games-core"
description = "The RedEngine Games launcher's library: the catalog, downloads, the installed games, launching and self-update."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
