name: Deploy download site

# The release workflows publish with GITHUB_TOKEN, whose events do not
# trigger `release:` workflows — so chain on the workflow run itself. A game
# uploaded from a computer (`distribution/upload_game.py`, a person's token)
# does fire `release:`.
on:
  workflow_run:
    workflows: ["Build Windows releases", "Launcher", "Upload a game"]
    types: [completed]
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - site/**
      - distribution/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # site/generate.py derives each game's added-date from history

      - name: Fetch every release (the record of every version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json

      - name: Test the site generator
        run: python3 -m unittest discover -s site

      - name: Generate the site
        run: python3 site/generate.py --releases releases.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
