name: Build Windows releases

# Each game is released on its own: a new version (a permanent GitHub Release tagged <slug>-vN with an installer and a portable ZIP) only when that game's content
# changed. See docs/DISTRIBUTION.md.
on:
  push:
    branches: [main]
    paths:
      - .games-catalog.json
      - .release-games.json
      - projects/**
      - distribution/**
      - .github/workflows/releases.yml
  workflow_dispatch:
    inputs:
      force:
        description: Release every game again, even if unchanged (an engine refresh)
        type: boolean
        default: false
      only:
        description: Only these game slugs (space separated); empty means all that changed
        type: string
        default: ''
      dry_run:
        description: Build everything but publish nothing (the files are attached to the run)
        type: boolean
        default: false

concurrency:
  group: redenginegames-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      engine_revision: ${{ steps.plan.outputs.engine_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the plan reads history to say what changed in each game

      - uses: dtolnay/rust-toolchain@stable

      - name: Test the release tool and the in-game launcher
        run: |
          python3 -m unittest discover -s distribution
          rustc --edition 2021 --test distribution/play_launcher.rs -o "$RUNNER_TEMP/play_launcher_test"
          "$RUNNER_TEMP/play_launcher_test"

      - name: Decide which games need a new version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ -n "$ONLY" ] && args+=(--only $ONLY)
          python3 distribution/release_tool.py plan --releases releases.json --out plan.json "${args[@]}"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("plan.json"))
          print(f"count={len(p['games'])}")
          print(f"engine_revision={p['engine_revision']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Check out the exact RedEngine source
        uses: actions/checkout@v7
        with:
          repository: kevstermcgee/RedEngine
          ref: ${{ needs.plan.outputs.engine_revision }}
          path: _engine
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _engine

      - name: Build RedEngine for Windows
        working-directory: _engine
        run: cargo build --release --locked --bin re2

      - name: Build the in-game launcher
        shell: bash
        run: rustc --edition 2021 -O distribution/play_launcher.rs -o "$RUNNER_TEMP/Play.exe"

      - name: Install Inno Setup and Pillow
        shell: bash
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi
          python -m pip install --quiet pillow

      - name: Sign the engine and the launcher (when a certificate is configured)
        shell: pwsh
        run: ./distribution/sign.ps1 _engine/target/release/re2.exe "$env:RUNNER_TEMP/Play.exe"

      - name: Stage, zip and compile the installers
        shell: bash
        run: python distribution/release_tool.py build --plan plan.json --engine _engine/target/release/re2.exe --launcher "$RUNNER_TEMP/Play.exe" --out dist

      - name: Smoke-test the install, in-place update and uninstall on this runner
        shell: pwsh
        run: |
          $first = (Get-Content plan.json -Raw | ConvertFrom-Json).games[0]
          ./distribution/smoke_install.ps1 -Installer "dist/assets/$($first.slug)-$($first.version)-setup.exe" -Slug $first.slug -Name $first.name

      - name: Sign the installers (when a certificate is configured)
        shell: pwsh
        run: ./distribution/sign.ps1 (Get-ChildItem dist/assets/*-setup.exe).FullName

      - name: Describe the releases
        shell: bash
        run: |
          signed=""
          [ -n "$SIGN_PFX_BASE64" ] && signed="--signed"
          python distribution/release_tool.py finalize --plan plan.json --out dist $signed

      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: |
            dist/assets
            dist/bodies
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish one release per game
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python distribution/release_tool.py publish --plan plan.json --out dist
